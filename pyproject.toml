[project]
name = "gauntlet"
version = "0.1.0"
description = "Declarative capability and safety evals for LLM agents, with a CI gate that fails the build when either regresses."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kelvin \"Bosire\" Nyakundi" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.scripts]
gauntlet = "gauntlet.cli:app"

[project.urls]
Homepage = "https://github.com/BosTheCoder/gauntlet"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
